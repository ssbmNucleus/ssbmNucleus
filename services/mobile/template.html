<meta charset="utf-8">
<title>Nucleus</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#06150c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<!-- iOS home-screen install: name + opaque icon (iOS ignores the manifest ones) -->
<meta name="apple-mobile-web-app-title" content="Nucleus">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<style>
  /* The desktop nucleOME token world (frontend/src/index.css [data-mode=
     "nucleome"]) shaped by the vAMP mobile app's chrome patterns: frosted
     sticky headers, bottom sheets for filters, icon tab bar, slide-up detail
     overlays. Single dark theme on purpose — it IS the app's theme. */
  :root {
    --bg-deep: #06150c;
    --bg-base: #081b10;
    --bg-elevated: #12271a;
    --bg-surface: #1a3424;
    --bg-hover: #2b4d38;

    --accent: #38e07c;
    --accent-light: #6ceb9f;
    --accent-muted: rgba(56, 224, 124, 0.15);

    --purple: #a78bfa;
    --purple-light: #c4b5fd;
    --purple-muted: rgba(167, 139, 250, 0.15);

    --text-1: #f5f5f5;
    --text-2: #b6c2ba;
    --text-3: #87958c;
    --muted:  #5c6b62;

    --success: #4ade80;
    --success-muted: rgba(74, 222, 128, 0.15);
    --danger: #ff4757;
    --danger-muted: rgba(255, 71, 87, 0.15);

    --border: #2b4d38;
    --border-subtle: #203c2a;

    --display: 'Exo 2', -apple-system, 'Segoe UI', system-ui, sans-serif;
    --body: 'DM Sans', -apple-system, 'Segoe UI', system-ui, sans-serif;
    --mono: ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;

    --tabbar: 60px;
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --ease: cubic-bezier(0.2, 0.9, 0.3, 1);
  }

  /* ── de-browserfying (the vAMP block): no tap flashes, no text selection on
     chrome, no rubber-band on the body, no scrollbars ── */
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg-deep); }
  /* hard rail: no element may open horizontal pan space — on iOS that shows
     as a void to the right and makes the fixed tab bar appear to drift */
  html, body { overflow-x: hidden; max-width: 100%; }
  body {
    color: var(--text-1);
    font-family: var(--body);
    font-size: 15px;
    -webkit-text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: contain;
    /* no double-tap-to-zoom: `manipulation` keeps scroll and pinch but drops
       the double-tap gesture (iOS Safari ignores user-scalable=no, so the
       meta alone doesn't do it). Intersection semantics make this cover every
       descendant; the steppers' touch-action:none still wins where set. */
    touch-action: manipulation;
  }
  body.no-scroll { overflow: hidden; }
  button, .month-head, .tabbar, .dhead, .sheet { -webkit-user-select: none; user-select: none; }
  img { -webkit-touch-callout: none; -webkit-user-drag: none; }
  * { scrollbar-width: none; }
  *::-webkit-scrollbar { width: 0; height: 0; display: none; }
  button { font-family: inherit; color: inherit; cursor: pointer; }

  .frosted {
    background: color-mix(in srgb, var(--bg-deep) 72%, transparent);
    -webkit-backdrop-filter: blur(20px) saturate(1.3);
    backdrop-filter: blur(20px) saturate(1.3);
  }

  .wrap {
    max-width: 680px;
    margin: 0 auto;
    padding: 0 0 calc(var(--tabbar) + var(--sab) + 24px);
    /* never shorter than the viewport: a loading tab used to collapse the
       document, and the browser-chrome resize that follows floats the fixed
       tab bar into the middle of the screen for a beat */
    min-height: 100dvh;
  }

  /* ── tab switch: the incoming page slides in from the side of the tapped
     tab (vAMP's tab-slide pattern — the outgoing page simply unmounts) ── */
  .wrap.slide-l { will-change: transform, opacity; animation: pageFromLeft .25s var(--ease); }
  .wrap.slide-r { will-change: transform, opacity; animation: pageFromRight .25s var(--ease); }
  @keyframes pageFromLeft {
    from { opacity: 0; transform: translate3d(-100%, 0, 0); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes pageFromRight {
    from { opacity: 0; transform: translate3d(100%, 0, 0); }
    to   { opacity: 1; transform: none; }
  }

  /* ── page header: large title left, quiet icon actions right ── */
  .head {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 8px;
    margin: 0 -0px 6px; padding: calc(10px + var(--sat)) 16px 10px;
    border-bottom: 1px solid transparent;
  }
  .head.is-stuck { border-bottom-color: var(--border-subtle); }
  .head h1 {
    font-family: var(--display); font-size: 22px; font-weight: 700;
    letter-spacing: -.01em;
  }
  .head .sub { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .head .grow { flex: 1 1 auto; }
  .headbtn {
    position: relative;
    width: 38px; height: 38px; border-radius: 12px;
    background: var(--bg-elevated); border: 1px solid var(--border-subtle);
    display: flex; align-items: center; justify-content: center;
    color: var(--text-2);
  }
  .headbtn:active { background: var(--bg-surface); }
  .headbtn svg { width: 18px; height: 18px; }
  .headbtn .dot {
    position: absolute; top: 7px; right: 7px; width: 7px; height: 7px;
    border-radius: 99px; background: var(--accent);
  }

  .pagebody { padding: 0 12px; }

  /* ── search + active filter pills ── */
  .searchrow { display: flex; gap: 6px; margin: 2px 0 8px; }
  .searchrow input[type="search"] {
    flex: 1 1 auto; min-width: 0; min-height: 42px; -webkit-user-select: text; user-select: text;
    background: var(--bg-elevated); border: 1px solid var(--border-subtle);
    border-radius: 12px; color: var(--text-1); font-size: 16px;
    padding: 8px 14px; font-family: var(--body);
  }
  .searchrow input:focus-visible { outline: none; border-color: var(--accent); }
  .pills {
    display: flex; gap: 6px; align-items: center;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    margin: 0 -12px 8px; padding: 0 12px 4px;
  }
  .pills:empty { display: none; }
  .pill {
    flex: none; display: inline-flex; align-items: center; gap: 6px;
    min-height: 32px; padding: 5px 8px 5px 12px; border-radius: 999px;
    background: var(--accent-muted); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
    color: var(--accent); font-size: 12px; font-weight: 600; white-space: nowrap;
  }
  .pill b { font-weight: 400; opacity: .75; margin-right: -2px; }
  .pill .x { font-size: 14px; line-height: 1; padding: 2px 4px; opacity: .8; }

  /* ── chip strip (secondary tabs: combos/stats keep the inline controls) ── */
  .filters {
    display: flex; gap: 6px; align-items: center;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    margin: 0 -12px 10px; padding: 2px 12px 6px;
  }
  .chip, .chipsel {
    flex: none; display: inline-flex; align-items: center; gap: 6px;
    min-height: 36px; padding: 6px 12px; border-radius: 999px;
    background: var(--bg-elevated); border: 1px solid var(--border-subtle);
    color: var(--text-2); font-size: 12.5px; font-weight: 500;
    white-space: nowrap;
  }
  .chip.is-on, .chipsel.is-on {
    background: var(--accent-muted); border-color: var(--accent);
    color: var(--accent);
  }
  .chipsel { position: relative; }
  .chipsel select {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; font-size: 16px; /* 16px stops iOS zoom-on-focus */
  }
  .daterow { display: none; gap: 6px; align-items: center; margin-bottom: 10px; }
  .daterow.is-open { display: flex; }
  .daterow input[type="date"] {
    flex: 1 1 0; min-width: 0; min-height: 40px;
    background: var(--bg-elevated); border: 1px solid var(--border-subtle);
    border-radius: 10px; color: var(--text-1); font-size: 14px;
    padding: 6px 10px; font-family: var(--mono);
  }
  .daterow .arrow { color: var(--muted); font-size: 12px; }
  .daterow .clear {
    background: none; border: none; color: var(--text-3); font-size: 16px;
    padding: 6px; min-height: 40px;
  }

  /* ── month sections: the whole header is the fold toggle, sized as a real
     touch target so skipping a month is one thumb tap ── */
  .month-head {
    display: flex; align-items: center; gap: 8px; width: 100%;
    min-height: 44px; margin: 8px 0 2px; padding: 4px 8px;
    background: none; border: 0; border-radius: 12px; text-align: left;
  }
  .month-head:active { background: var(--bg-elevated); }
  .month-head .chev {
    flex: none; display: flex; color: var(--muted);
    transition: transform .16s var(--ease), color .16s ease;
  }
  .month-head .chev svg { width: 14px; height: 14px; }
  .month-head.is-collapsed .chev { transform: rotate(-90deg); color: var(--accent); }
  .month-head .name {
    font-family: var(--display); font-weight: 700; font-size: 13px;
    text-transform: uppercase; letter-spacing: .06em; color: var(--text-2);
  }
  .month-head .count {
    font-family: var(--mono); font-size: 10px; color: var(--muted);
    background: var(--bg-elevated); padding: 1px 8px; border-radius: 999px;
  }
  /* a folded month says what it's hiding — accent the tally, not the label */
  .month-head.is-collapsed .count {
    background: var(--accent-muted); color: var(--accent-light);
  }
  /* folds are instant: .replay-row sets display:flex, which beats [hidden] */
  .replay-row[hidden] { display: none; }

  /* ── replay rows ── */
  .list { display: flex; flex-direction: column; gap: 8px; }
  .replay-row {
    display: flex; align-items: center; gap: 10px; width: 100%;
    text-align: left; font: inherit;
    background: var(--bg-elevated); border: 1px solid var(--border-subtle);
    border-radius: 16px; padding: 11px 12px;
    animation: rowIn 0.32s var(--ease) both;
    animation-delay: calc(var(--row-i, 0) * 24ms);
    transition: transform .1s ease, background .12s ease;
  }
  .replay-row:active { background: var(--bg-surface); transform: scale(0.985); }
  .replay-row.no-anim { animation: none; }
  @keyframes rowIn {
    from { opacity: 0; transform: translateY(10px) scale(0.995); }
    to   { opacity: 1; transform: none; }
  }

  .result {
    flex: 0 0 30px; height: 30px; display: flex; align-items: center;
    justify-content: center; border-radius: 9px;
    font-family: var(--display); font-weight: 700; font-size: 13px;
  }
  .result--win  { color: var(--success); background: var(--success-muted); }
  .result--loss { color: var(--danger);  background: var(--danger-muted); }
  .result--unknown { color: var(--muted); }

  .row-main { flex: 1 1 auto; min-width: 0; }
  .versus {
    display: grid; grid-template-columns: 1fr auto 1fr;
    align-items: center; gap: 8px;
  }
  .pl { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .pl--left  { justify-content: flex-end; text-align: right; }
  .pl--right { justify-content: flex-start; text-align: left; }
  .pl-char { width: 24px; height: 24px; flex: none; image-rendering: pixelated; }
  .pl-id { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
  .pl--left .pl-id { align-items: flex-end; }
  .pl--right .pl-id { align-items: flex-start; }
  .pl-name {
    font-weight: 600; font-size: 13.5px; max-width: 100%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pl-tag {
    font-family: var(--mono); font-size: 10px; color: var(--text-3);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 12ch;
  }
  .pl-stocks { display: flex; gap: 1px; height: 9px; margin-top: 2px; }
  .pl-stocks img { width: 9px; height: 9px; image-rendering: pixelated; }
  /* Slippi rank badge. Reserves its width even when empty — an unranked side
     that collapsed would slide the row's "vs" off centre as badges stream in. */
  /* Each rank is pinned to its row's OUTER edge, so the badges form two clean
     columns instead of drifting with the length of the name beside them. */
  .pl-rank { width: 22px; height: 22px; flex: none; }
  .pl--left .pl-rank { margin-right: auto; }
  .pl--right .pl-rank { margin-left: auto; }
  .pl-rank img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .vs-mid { color: var(--muted); font-size: 10.5px; flex: none; }

  .row-meta {
    display: flex; align-items: center; gap: 6px;
    margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border-subtle);
    font-size: 11px; color: var(--text-3);
  }
  .stage-ico {
    width: 24px; height: 18px; object-fit: cover; border-radius: 4px; flex: none;
  }
  .row-meta .stg { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-meta .dot { color: var(--muted); }
  .row-meta .grow { flex: 1 1 auto; }
  .row-meta .dur { font-family: var(--mono); }

  .multi { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .multi-chars { font-weight: 600; font-size: 13px; display: flex; align-items: center;
                 gap: 4px; flex-wrap: wrap; }
  .multi-opp { font-size: 11px; color: var(--text-3);
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .more-btn, .wide {
    width: 100%; min-height: 46px; margin-top: 10px;
    background: var(--bg-elevated); border: 1px solid var(--border-subtle);
    border-radius: 14px; color: var(--text-2); font-size: 14px; font-weight: 600;
  }
  .more-btn:active, .wide:active { background: var(--bg-surface); }
  /* while a page is in flight the sentinel goes quiet — the big elevated bar
     sitting mid-screen saying "Loading…" read as broken chrome */
  .more-btn.is-loading { background: none; border-color: transparent;
                         color: var(--text-3); font-size: 12.5px; font-weight: 500; }
  .empty { color: var(--muted); font-size: 13.5px; text-align: center;
           padding: 44px 12px; line-height: 1.7; }
  .spin { color: var(--text-3); text-align: center; padding: 30px; font-size: 13px; }

  /* ── loading skeletons: combo-card-shaped shimmer while the first page is
     in flight, instead of a lone "Loading…" bar on an empty screen ── */
  .sk { display: flex; flex-direction: column; gap: 8px; }
  .sk[hidden] { display: none; }
  .sk-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--bg-elevated); border: 1px solid var(--border-subtle);
    border-radius: 16px; padding: 11px 12px; min-height: 66px;
    animation: rowIn 0.32s var(--ease) both;
    animation-delay: calc(var(--row-i, 0) * 24ms);
  }
  .sk-row i { display: block; background: var(--bg-surface); border-radius: 7px;
              animation: skPulse 1s ease-in-out infinite alternate; }
  .sk-row .sk-a { flex: 0 0 44px; height: 30px; margin: 0 5px; }
  .sk-row .sk-main { flex: 1 1 auto; display: flex; flex-direction: column; gap: 7px; }
  .sk-row .sk-b { height: 12px; width: 70%; }
  .sk-row .sk-c { height: 9px; width: 45%; }
  @keyframes skPulse { from { opacity: .45; } to { opacity: 1; } }

  /* ── combo cards ── */
  .combo-row {
    display: flex; align-items: center; gap: 10px; width: 100%;
    text-align: left; font: inherit;
    background: var(--bg-elevated); border: 1px solid var(--border-subtle);
    border-radius: 16px; padding: 11px 12px;
    animation: rowIn 0.32s var(--ease) both;
    animation-delay: calc(var(--row-i, 0) * 24ms);
    transition: transform .1s ease, background .12s ease;
  }
  .combo-row:active { background: var(--bg-surface); transform: scale(0.985); }
  .combo-row.no-anim { animation: none; }
  .combo-dmg {
    flex: 0 0 54px; text-align: center;
    font-family: var(--mono); font-weight: 700; font-size: 15px;
    color: var(--purple);
  }
  .combo-dmg small { display: block; font-size: 9px; color: var(--muted); font-weight: 500; }
  .combo-badges { display: flex; flex-direction: column; align-items: center; gap: 3px;
                  margin-top: 5px; }
  .combo-main { flex: 1 1 auto; min-width: 0; }
  .combo-line1 { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; }
  .combo-line1 img { width: 20px; height: 20px; image-rendering: pixelated; }
  .combo-line1 .vs-mid { font-weight: 400; }
  .combo-line2 { display: flex; align-items: center; gap: 6px; margin-top: 3px;
                 font-size: 11px; color: var(--text-3); }
  .kill-badge {
    font-size: 9px; font-weight: 800; letter-spacing: .07em;
    color: #06150c; background: var(--danger);
    padding: 2px 6px; border-radius: 4px; flex: none;
  }
  .true-badge {
    font-size: 9px; font-weight: 800; letter-spacing: .07em;
    color: #06150c; background: var(--accent);
    padding: 2px 6px; border-radius: 4px; flex: none;
  }
  .combo-seq {
    display: block; margin-top: 3px; font-size: 11px; color: var(--text-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .combo-range { font-family: var(--mono); color: var(--text-3); }
  .playall {
    min-height: 38px; padding: 0 16px; border: none; border-radius: 999px;
    background: linear-gradient(135deg, #38e07c 0%, #21ba45 100%);
    color: #06150c; font-family: var(--display); font-weight: 700; font-size: 13px;
  }
  .playall:active { transform: scale(0.96); }
  .theater-info {
    display: flex; align-items: center; gap: 8px; padding: 8px 14px 0;
    font-size: 12px; min-height: 30px;
  }
  .theater-seq {
    flex: 1 1 auto; min-width: 0; color: var(--text-2); font-size: 11.5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .dcombo-line { display: flex; align-items: center; gap: 8px; }
  .dcombo-seq {
    display: block; margin-top: 2px; font-size: 10.5px; color: var(--text-3);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ── stats ── */
  .statline {
    display: flex; align-items: baseline; justify-content: center; gap: 14px;
    flex-wrap: wrap; padding: 10px 0 2px;
  }
  .stat { display: inline-flex; align-items: baseline; gap: 5px; }
  .stat-num { font-family: var(--display); font-weight: 700; font-size: 19px; }
  .stat-num.is-up { color: var(--success); }
  .stat-num.is-down { color: var(--danger); }
  .stat-label { font-size: 11px; color: var(--text-3); }
  .stat-div { width: 1px; height: 16px; background: var(--border-subtle); align-self: center; }
  .statline-caption { text-align: center; font-size: 11.5px; color: var(--text-3); margin: 4px 0 6px; }
  .statline-caption .is-up { color: var(--success); }
  .statline-caption .is-down { color: var(--danger); }

  .section {
    background: var(--bg-elevated); border: 1px solid var(--border-subtle);
    border-radius: 16px; padding: 13px 14px; margin-top: 10px;
  }
  .section-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .section-head h3 { font-family: var(--display); font-size: 14px; font-weight: 700; }
  .section-head span { font-size: 10.5px; color: var(--muted); }

  .srow { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
  .srow-icon { width: 20px; height: 20px; flex: none; image-rendering: pixelated; }
  .srow-icon--stage { width: 24px; height: 18px; object-fit: cover; border-radius: 3px; }
  .srow-name { flex: 1 1 auto; min-width: 0; font-size: 12.5px;
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .srow-name small { color: var(--muted); font-family: var(--mono); font-size: 10px; margin-left: 5px; }
  .srow-games { font-family: var(--mono); font-size: 11px; color: var(--text-3); flex: none; }
  .winbar {
    flex: 0 0 64px; height: 5px; border-radius: 3px;
    background: var(--bg-deep); position: relative; overflow: hidden;
  }
  .winbar i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; }
  .winbar i.is-up { background: var(--success); }
  .winbar i.is-down { background: var(--danger); }
  .winbar b { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px;
              background: var(--border); }
  .srow-rate { flex: 0 0 46px; text-align: right; font-family: var(--mono);
               font-size: 11.5px; }
  .srow-rate.is-up { color: var(--success); }
  .srow-rate.is-down { color: var(--danger); }

  .bars { display: flex; align-items: flex-end; gap: 2px; height: 84px; margin-top: 4px; }
  .bars .col { flex: 1 1 0; display: flex; flex-direction: column; align-items: center;
               justify-content: flex-end; height: 100%; min-width: 0; }
  .bars .bar { width: 100%; border-radius: 2px 2px 0 0; background: var(--accent);
               opacity: .75; min-height: 0; }
  .bars .tick { font-size: 8px; color: var(--muted); margin-top: 3px;
                font-family: var(--mono); white-space: nowrap; }

  .show-all {
    width: 100%; margin-top: 8px; background: none; border: none;
    color: var(--accent); font-size: 12px; font-weight: 600; padding: 8px;
  }
  .footnote { font-size: 10.5px; color: var(--muted); margin-top: 8px; line-height: 1.5; }

  /* ── tournaments ── */
  .tourney-connect { display: flex; gap: 8px; }
  .tourney-connect input {
    flex: 1 1 auto; min-width: 0; min-height: 44px; -webkit-user-select: text; user-select: text;
    background: var(--bg-elevated); border: 1px solid var(--border-subtle);
    border-radius: 12px; color: var(--text-1); font-size: 16px; padding: 8px 12px;
  }
  .tourney-connect button {
    flex: none; padding: 0 18px; border-radius: 12px; border: none;
    background: var(--accent); color: #06150c; font-weight: 700; font-size: 14px;
  }
  .tourney-profile { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .tourney-profile .tag { font-family: var(--display); font-weight: 700; font-size: 16px; }
  .tourney-profile .slug { font-size: 11px; color: var(--muted); font-family: var(--mono); }
  .tourney-profile .disconnect { margin-left: auto; background: none; border: none;
    color: var(--muted); font-size: 11px; text-decoration: underline; padding: 6px; }

  .event-card { margin-top: 10px; }
  .event-top { display: flex; align-items: center; gap: 10px; }
  .event-place {
    flex: 0 0 46px; text-align: center;
    font-family: var(--display); font-weight: 800; font-size: 17px;
    color: var(--purple);
  }
  .event-place small { display: block; font-size: 8.5px; color: var(--muted);
                       font-family: var(--body); font-weight: 500; letter-spacing: .05em; }
  .event-name { flex: 1 1 auto; min-width: 0; }
  .event-name .t { font-weight: 700; font-size: 13.5px; white-space: nowrap;
                   overflow: hidden; text-overflow: ellipsis; }
  .event-name .s { font-size: 11px; color: var(--text-3); white-space: nowrap;
                   overflow: hidden; text-overflow: ellipsis; }
  .delta { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px; flex: none; }
  .delta--up   { color: var(--success); background: var(--success-muted); }
  .delta--down { color: var(--danger); background: var(--danger-muted); }
  .delta--even { color: var(--text-3); background: var(--bg-surface); }

  .sets { margin-top: 8px; border-top: 1px solid var(--border-subtle); padding-top: 4px; }
  .set-row { display: flex; align-items: center; gap: 8px; padding: 7px 0;
             font-size: 12px; border: none; background: none; width: 100%;
             text-align: left; }
  .set-wl { flex: 0 0 18px; height: 18px; border-radius: 5px; display: flex;
            align-items: center; justify-content: center;
            font-size: 10px; font-weight: 800; font-family: var(--display); }
  .set-wl.w { color: var(--success); background: var(--success-muted); }
  .set-wl.l { color: var(--danger); background: var(--danger-muted); }
  .set-opp { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden;
             text-overflow: ellipsis; font-weight: 600; }
  .set-opp small { color: var(--muted); font-weight: 400; margin-left: 5px; }
  .set-score { font-family: var(--mono); font-size: 11px; color: var(--text-2); flex: none; }
  .set-round { font-size: 9.5px; color: var(--muted); flex: none; max-width: 9ch;
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .set-replays { flex: none; font-size: 9.5px; color: var(--accent);
                 background: var(--accent-muted); border-radius: 4px; padding: 2px 6px; }
  .upset-badge { flex: none; font-size: 9px; font-weight: 800; color: #06150c;
                 background: var(--purple); padding: 2px 5px; border-radius: 4px; }

  /* ── tab bar: frosted, rounded top, icons + labels ── */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex;
    border-top: 1px solid var(--border-subtle);
    border-radius: 20px 20px 0 0;
    padding-bottom: var(--sab);
  }
  .tabbar button {
    /* relative so the buttons paint above the sliding .tab-ind pill */
    position: relative;
    flex: 1 1 0; background: none; border: none; border-radius: 0;
    color: var(--muted); font-size: 10px; font-weight: 600;
    font-family: var(--display);
    height: var(--tabbar);
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 3px;
  }
  .tabbar button svg { width: 22px; height: 22px; transition: transform .18s var(--ease); }
  .tabbar button[aria-selected="true"] { color: var(--accent); }
  .tabbar button:active svg { transform: scale(0.85); }
  /* the sliding pill behind the active icon: its width is one tab slot (set
     inline as 100%/tab-count), so translateX in % of its own width lands it
     exactly on each slot — no measuring (the vAMP LibraryTabs pattern) */
  .tab-ind {
    position: absolute; top: 0; left: 0; height: var(--tabbar);
    display: flex; justify-content: center; align-items: flex-start;
    padding-top: 7px; pointer-events: none;
    transition: transform .3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .tab-ind i { display: block; width: 46px; height: 30px; border-radius: 999px;
               background: var(--accent-muted); }
  /* elastic bounce on the newly active icon (vAMP tab-bounce-big):
     deep squash, big overshoot, damped settle */
  .tabbar button.is-bouncing svg { animation: tabBounce .45s ease-out; }
  @keyframes tabBounce {
    0%   { transform: scale(1); }
    25%  { transform: scale(0.7); }
    55%  { transform: scale(1.25); }
    75%  { transform: scale(0.92); }
    90%  { transform: scale(1.04); }
    100% { transform: scale(1); }
  }

  /* ── bottom sheet ── */
  .sheet-backdrop {
    position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, 0.45);
    animation: fadeIn .2s ease both;
  }
  .sheet-backdrop.is-leaving { animation: fadeOut .2s ease both; }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes fadeOut { from { opacity: 1 } to { opacity: 0 } }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 61;
    background: var(--bg-base); border: 1px solid var(--border-subtle);
    border-bottom: none; border-radius: 22px 22px 0 0;
    padding: 0 14px calc(12px + var(--sab));
    max-height: calc(100dvh - var(--sat) - 40px);
    display: flex; flex-direction: column;
    animation: sheetIn .25s var(--ease) both;
    box-shadow: 0 -8px 30px rgba(0, 0, 0, .4);
  }
  .sheet.is-leaving { animation: sheetOut .2s cubic-bezier(0.4, 0, 0.7, 0.2) both; }
  @keyframes sheetIn { from { transform: translateY(100%) } to { transform: none } }
  @keyframes sheetOut { from { transform: none } to { transform: translateY(105%) } }
  .sheet-handle { display: flex; justify-content: center; padding: 10px 0 4px; }
  .sheet-handle i { width: 40px; height: 4px; border-radius: 99px; background: var(--bg-hover); }
  .sheet-title {
    font-family: var(--display); font-weight: 700; font-size: 15px;
    text-align: center; padding: 6px 0 8px;
  }
  /* overflow-x is pinned: giving one axis `auto` makes the other scrollable
     too, and a single long connect code + tag then turned the whole sheet
     into a sideways-draggable surface. */
  .sheet-body { overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; min-height: 0; }
  .sheet { max-width: 100%; }
  .sheet-row-label, .sheet-row-sub { overflow-wrap: anywhere; }
  .sheet-row {
    display: flex; align-items: center; gap: 12px; width: 100%;
    background: none; border: none; text-align: left;
    padding: 12px 6px; min-height: 52px;
    border-radius: 12px; font: inherit;
  }
  .sheet-row:active { background: var(--bg-elevated); }
  .sheet-row.is-danger .sheet-row-label { color: var(--danger); }
  .sheet-row-icon {
    width: 38px; height: 38px; border-radius: 11px; flex: none;
    background: var(--bg-elevated); display: flex; align-items: center;
    justify-content: center; font-size: 16px; color: var(--text-2);
  }
  .sheet-row-icon img { width: 22px; height: 22px; image-rendering: pixelated; }
  .sheet-row-icon svg { width: 18px; height: 18px; }
  .sheet-row-text { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
  .sheet-row-label { font-size: 15px; font-weight: 500; }
  .sheet-row-sub { font-size: 12px; color: var(--text-3); margin-top: 1px; }
  .sheet-row-check { color: var(--accent); font-weight: 800; }
  .sheet-cancel {
    flex: none; width: 100%; min-height: 48px; margin-top: 8px;
    background: var(--bg-elevated); border: none; border-radius: 14px;
    color: var(--accent); font-size: 15px; font-weight: 600;
  }
  .sheet-group {
    font-size: 10.5px; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted); padding: 12px 6px 4px;
  }
  .sheet-chiprow { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 6px 8px; }
  .sheet-chip {
    display: inline-flex; align-items: center; gap: 6px;
    min-height: 36px; padding: 6px 12px; border-radius: 999px;
    background: var(--bg-elevated); border: 1px solid var(--border-subtle);
    color: var(--text-2); font-size: 12.5px; font-weight: 500;
  }
  .sheet-chip img { width: 16px; height: 16px; image-rendering: pixelated; }
  .sheet-chip.is-on {
    background: var(--accent-muted); border-color: var(--accent); color: var(--accent);
  }

  /* ── detail overlay: slide-up page, sticky player ── */
  .detail {
    position: fixed; inset: 0; z-index: 40; background: var(--bg-deep);
    display: flex; flex-direction: column;
    animation: detailIn .25s var(--ease) both;
  }
  .detail.is-leaving { animation: detailOut .22s cubic-bezier(0.4, 0, 0.7, 0.2) both; }
  @keyframes detailIn { from { transform: translateY(100%) } to { transform: none } }
  @keyframes detailOut { from { transform: none } to { transform: translateY(100%) } }
  .dhead {
    position: relative; z-index: 3;
    display: flex; align-items: center; gap: 10px;
    padding: calc(8px + var(--sat)) 12px 8px;
  }
  .dhead .titles { flex: 1 1 auto; min-width: 0; }
  /* the match card compacted to header size — it replaced the plain-text
     "Fox vs Sheik" h2, which duplicated the summary section below it */
  .dhead .titles .dsum { gap: 6px; }
  .dhead .titles .dsum-char { width: 22px; height: 22px; }
  .dhead .titles .dsum-name { font-size: 12px; }
  .dhead .titles .dsum .result { flex-basis: 20px; height: 20px; font-size: 10px; }
  .dhead .titles .row-meta { margin-top: 5px !important; padding-top: 5px; font-size: 10px; }
  .dhead .titles .stage-ico { width: 20px; height: 15px; }
  .dhead .titles .dsum-rank { width: 20px; height: 20px; }
  .dhead h2 { font-family: var(--display); font-size: 15px; font-weight: 700;
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dhead .sub { font-size: 10.5px; color: var(--text-3); }
  .iconbtn {
    min-height: 40px; min-width: 40px; padding: 6px; font-size: 19px;
    background: var(--bg-elevated); border: 1px solid var(--border-subtle);
    border-radius: 12px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .iconbtn:active { background: var(--bg-surface); }
  .iconbtn:disabled { opacity: .4; }
  .dscroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  /* soft shadow instead of a hairline — hard 1px borders around the video
     read as unfinished on a phone */
  .dplayer { position: sticky; top: 0; z-index: 2; background: var(--bg-deep);
             box-shadow: 0 10px 18px -12px rgba(0, 0, 0, .65); }
  .dcanvas { display: block; width: 100%; height: 40vh; min-height: 220px; background: #0a0c12; }
  .transport {
    display: flex; align-items: center; gap: 12px; padding: 10px 14px 6px;
  }
  .transport input[type="range"] { flex: 1 1 auto; min-width: 0; height: 36px; }
  /* custom slider: thin rounded track filled to --p in accent, small bright
     thumb — the stock control is the single most "not an app" element there is */
  input[type="range"].seek {
    -webkit-appearance: none; appearance: none; background: transparent;
  }
  input[type="range"].seek::-webkit-slider-runnable-track {
    height: 5px; border-radius: 3px;
    background: linear-gradient(to right,
      var(--accent) var(--p, 0%), var(--bg-hover) var(--p, 0%));
  }
  input[type="range"].seek::-webkit-slider-thumb {
    -webkit-appearance: none; width: 17px; height: 17px; margin-top: -6px;
    border-radius: 99px; background: #fff; border: none;
    box-shadow: 0 1px 5px rgba(0, 0, 0, .55);
  }
  input[type="range"].seek::-moz-range-track {
    height: 5px; border-radius: 3px; background: var(--bg-hover);
  }
  input[type="range"].seek::-moz-range-progress {
    height: 5px; border-radius: 3px; background: var(--accent);
  }
  input[type="range"].seek::-moz-range-thumb {
    width: 17px; height: 17px; border-radius: 99px; background: #fff;
    border: none; box-shadow: 0 1px 5px rgba(0, 0, 0, .55);
  }
  .playbtn { color: var(--accent); }
  .playbtn svg { display: block; }
  .dwindow {
    display: flex; align-items: center; gap: 8px;
    padding: 0 14px 6px; font-size: 11px; color: var(--purple);
    font-family: var(--mono);
  }
  .dwindow[hidden] { display: none; }
  /* An underlined string is not a button. This is the one control that gets
     you out of a combo loop and back to the whole game, so it looks like
     something you press. */
  .dwindow .linkish {
    margin-left: auto; text-decoration: none;
    padding: 5px 12px; min-height: 30px; border-radius: 999px;
    background: var(--bg-elevated); border: 1px solid var(--border);
    color: var(--text-2); font-family: var(--body); font-weight: 600;
  }
  .dwindow .linkish:active { background: var(--bg-surface); color: var(--text-1); }
  .dstatus { font-family: var(--mono); font-size: 10.5px; color: var(--text-3);
             padding: 0 14px 8px; min-height: 14px; }
  .dbody { padding: 2px 12px calc(24px + var(--sab)); }

  .dsum { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
  .dsum-side { display: flex; align-items: center; gap: 8px; min-width: 0; }
  /* mirrored, not merely right-justified: char icons at the outer edges, rank
     then W/L pairing off symmetrically around the vs */
  .dsum-side--r { flex-direction: row-reverse; }
  .dsum-side--r .dsum-id { align-items: flex-end; text-align: right; }
  .dsum-rank { width: 24px; height: 24px; flex: none; }
  .dsum-rank img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .dsum-norank { display: grid; place-items: center; width: 100%; height: 100%;
                 color: var(--muted); font-size: 13px; }
  .dsum-char { width: 26px; height: 26px; flex: none; image-rendering: pixelated; }
  .dsum-id { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
  a.dsum-name { color: inherit; text-decoration: none; }
  a.dsum-name:active { text-decoration: underline; }
  .dsum-name { font-weight: 600; font-size: 13.5px; white-space: nowrap;
               overflow: hidden; text-overflow: ellipsis; }
  .dsum-tag { font-family: var(--mono); font-size: 10px; color: var(--text-3); }
  .dsum .result { flex: 0 0 24px; height: 24px; font-size: 11px; border-radius: 7px; }

  /* Two columns, one per player: which side a combo is on IS the answer to
     "whose is it", so the cell carries only when / how much / how far. */
  .dcombo-cols { display: flex; gap: 8px; align-items: flex-start; }
  .dcombo-col { flex: 1 1 0; min-width: 0; }
  .dcombo-colhead {
    display: flex; align-items: center; gap: 6px;
    padding: 2px 4px 6px; font-size: 12px; font-weight: 600; color: var(--text-2);
  }
  .dcombo-colhead img { width: 18px; height: 18px; image-rendering: pixelated; }
  .dcombo-colhead span { flex: 1 1 auto; min-width: 0;
                         overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dcombo-colhead b { font-family: var(--mono); font-size: 11px; font-weight: 400; color: var(--muted); }
  .dcombo-none { padding: 4px; color: var(--muted); }

  .dcombo-cell {
    position: relative; display: block; width: 100%; text-align: left;
    padding: 8px 34px 8px 8px; margin-bottom: 6px; border-radius: 12px;
    background: var(--bg-elevated); border: 1px solid var(--border-subtle);
  }
  .dcombo-cell:active { background: var(--bg-surface); }
  .dcombo-cell.is-active { background: var(--purple-muted); border-color: var(--purple); }
  .dcombo-top { display: flex; align-items: baseline; gap: 6px; }
  .dcombo-dmg { font-family: var(--mono); font-weight: 700; font-size: 15px; color: var(--purple); }
  .dcombo-time { font-family: var(--mono); font-size: 11px; color: var(--text-3); }
  .dcombo-sub { display: block; margin-top: 2px; font-size: 11px; color: var(--text-3); }
  .dcombo-badges { display: flex; gap: 4px; margin-top: 5px; }
  /* the share target sits in the cell's right gutter, not in the flow */
  .dcombo-share {
    position: absolute; top: 6px; right: 4px;
    display: flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; border-radius: 9px; color: var(--text-3);
  }
  .dcombo-share svg { width: 15px; height: 15px; }

  /* ── auth ── */
  .lede { font-size: 13.5px; line-height: 1.65; color: var(--text-2); margin: 8px 0 18px; }
  input[type="password"] {
    width: 100%; font-family: var(--mono); font-size: 13px; -webkit-user-select: text; user-select: text;
    color: var(--text-1); background: var(--bg-elevated);
    border: 1px solid var(--border-subtle); border-radius: 12px;
    padding: 13px; min-height: 46px;
  }
  input[type="password"]:focus-visible { outline: none; border-color: var(--accent); }
  input[type="date"] { color-scheme: dark; }
  .cta {
    width: 100%; min-height: 46px; margin-top: 10px; border: none;
    border-radius: 14px; background: linear-gradient(135deg, #38e07c 0%, #21ba45 100%);
    color: #06150c; font-family: var(--display); font-weight: 700; font-size: 15px;
  }
  .cta:active { transform: scale(0.98); }
  .cta--quiet { background: var(--bg-elevated); color: var(--text-2);
                border: 1px solid var(--border-subtle); }
  .auth-or { text-align: center; font-size: 11.5px; color: var(--muted);
             margin: 16px 0 10px; }
  /* signed-out shell: the pairing card, centered in each tab's frame */
  .connect-hero {
    display: flex; flex-direction: column; justify-content: center;
    min-height: calc(100dvh - 210px);
    max-width: 330px; margin: 0 auto; width: 100%; padding-bottom: 16px;
  }
  .patreon-cta {
    display: flex; align-items: center; justify-content: center;
    min-height: 46px; border-radius: 14px; text-decoration: none;
    background: #ff424d; color: #fff;
    font-family: var(--display); font-weight: 700; font-size: 15px;
  }
  .patreon-cta:active { transform: scale(0.98); }
  /* the paywall above it: what the phone app is and what it costs */
  .paywall { margin-bottom: 18px; }
  .paywall-eyebrow { margin: 0 0 6px; color: var(--accent); font-size: 11.5px; font-weight: 700;
                     letter-spacing: 0.06em; text-transform: uppercase; }
  .paywall-title { margin: 0 0 12px; color: var(--text-1); font-family: var(--display);
                   font-size: 22px; line-height: 1.2; }
  .paywall-perks { margin: 0 0 14px; padding: 0; list-style: none; display: grid; gap: 8px; }
  .paywall-perks li { position: relative; padding-left: 18px; color: var(--text-2); font-size: 14px; line-height: 1.4; }
  .paywall-perks li::before { content: ''; position: absolute; left: 2px; top: 0.5em; width: 7px; height: 7px;
                              border-radius: 50%; background: var(--accent); }
  .paywall-price { margin: 0; color: var(--text-2); font-size: 13px; }
  .paywall-price strong { color: var(--text-1); font-size: 15px; }
  .paywall-text { margin: 0; color: var(--text-2); font-size: 14px; line-height: 1.45; }
  .paywall--lapsed .paywall-eyebrow { color: #e8b23a; }
  .linkish { background: none; border: none; color: var(--muted); font-size: 12px;
             text-decoration: underline; min-height: 32px; padding: 4px; }

  /* ── pairing QR scanner ── */
  .scanner { position: fixed; inset: 0; z-index: 95; background: #000; }
  .scanner-video { position: absolute; inset: 0; width: 100%; height: 100%;
                   object-fit: cover; }
  .scanner-chrome { position: absolute; inset: 0; display: flex;
                    flex-direction: column; align-items: center;
                    justify-content: center; gap: 14px;
                    padding: calc(12px + var(--sat)) 24px calc(16px + var(--sab)); }
  .scanner-frame { width: min(64vw, 260px); aspect-ratio: 1;
                   border: 2.5px solid rgba(255, 255, 255, 0.92);
                   border-radius: 22px;
                   box-shadow: 0 0 0 200vmax rgba(0, 0, 0, 0.45); }
  .scanner-hint { max-width: 300px; text-align: center; font-size: 13px;
                  line-height: 1.5; color: #fff;
                  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7); }
  .scanner-cancel { position: absolute; left: 24px; right: 24px;
                    bottom: calc(16px + var(--sab)); min-height: 46px;
                    border: none; border-radius: 14px;
                    background: rgba(255, 255, 255, 0.14); color: #fff;
                    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
                    font-family: var(--display); font-weight: 700; font-size: 15px; }
  .scanner-cancel:active { background: rgba(255, 255, 255, 0.24); }

  #toast {
    position: fixed; left: 12px; right: 12px;
    bottom: calc(var(--tabbar) + var(--sab) + 12px); z-index: 70;
    background: var(--bg-surface); border: 1px solid var(--danger);
    font-size: 13px; padding: 12px 14px; border-radius: 12px;
  }

  /* ── player fullscreen + hud (orchestrator) ── */
  /* In the transport row, beside the scrubber — floating over the canvas put
     them straight on top of the second player's HUD. */
  .fsbtn {
    flex: none; min-width: 34px; min-height: 34px; padding: 4px;
    background: transparent; border-color: transparent;
    color: var(--text-3);
  }
  .fsbtn:active { color: var(--text-1); }
  .dplayer.is-full {
    position: fixed; inset: 0; z-index: 90;
    display: flex; flex-direction: column;
    background: #0a0c12; box-shadow: none;
  }
  .dplayer.is-full .dcanvas { flex: 1 1 auto; height: auto; min-height: 0; }
  .dplayer.is-full .transport { padding-bottom: calc(12px + var(--sab)); }
  .dplayer.is-full .dwindow, .dplayer.is-full .dstatus { display: none; }
  .gg-link {
    flex: none; min-width: 34px; min-height: 34px; padding: 4px;
    background: none; border: none; color: var(--muted);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .gg-link:active { color: var(--accent); }
  /* Health-style period switcher + fat tappable bars */
  .seg {
    display: inline-flex; gap: 2px; margin: 0 0 10px;
    background: var(--bg-deep); border-radius: 10px; padding: 3px;
  }
  .seg button {
    min-height: 30px; padding: 4px 16px; border: none; border-radius: 8px;
    background: none; color: var(--text-3); font-size: 12px; font-weight: 600;
    font-family: var(--display);
  }
  .seg button.is-on { background: var(--bg-surface); color: var(--text-1); }
  .bars--fat { height: 96px; gap: 6px; }
  .bars--fat .col { max-width: 64px; }
  .bars--fat .bar { border-radius: 5px 5px 0 0; opacity: .85; }
  .bars--fat .tick { font-size: 9.5px; margin-top: 4px; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* ── stats-mobile (agent E) ── */
  /* hero: the one-glance answer — a display-size winrate with the record and
     the volume figures orbiting it, instead of five equally-weighted numbers */
  .hero { text-align: center; padding: 16px 0 2px; }
  .hero-wr { font-family: var(--display); font-weight: 800; font-size: 54px;
             line-height: 1; letter-spacing: -0.02em; }
  .hero-wr small { font-size: 26px; font-weight: 700; margin-left: 2px; opacity: .85; }
  .hero-wr.is-up { color: var(--success); }
  .hero-wr.is-down { color: var(--danger); }
  .hero-rec { margin-top: 7px; font-size: 13px; color: var(--text-3); }
  .hero-rec b { font-weight: 700; }
  .hero-rec .w { color: var(--success); }
  .hero-rec .l { color: var(--danger); }
  .hero-strip { display: flex; justify-content: center; align-items: center;
                gap: 7px; flex-wrap: wrap; margin-top: 12px;
                font-family: var(--mono); font-size: 11px; color: var(--text-3); }
  .hero-strip i { font-style: normal; color: var(--muted); }
  .hero-caption { text-align: center; font-size: 11px; color: var(--muted); margin-top: 5px; }

  /* stat rows sized for thumbs: taller rows, a winbar that reads at arm's
     length (the 5px desktop bar is a hairline on a phone) */
  .srow--lg { padding: 8px 0; min-height: 40px; }
  .srow--lg .srow-name { font-size: 13px; }
  .winbar--lg { flex-basis: 72px; height: 7px; border-radius: 4px; }

  /* tappable charts: shorter than the desktop bars, full-bleed inside the
     card, one shared readout line under the chart instead of hover tooltips
     touch can't reach. The whole column strip is the tap target. */
  .chart-bleed { margin: 0 -14px; padding: 0 10px; }
  .bars--tap { height: 72px; gap: 2px; }
  .bars--tap .bar { border-radius: 3px 3px 0 0; }
  .bars--tap .col.is-sel .bar { background: var(--accent-light); opacity: 1; min-height: 2px; }
  .bars--tap .col.is-sel .tick { color: var(--accent); }
  .chart-readout { min-height: 17px; margin: 8px 4px 0; text-align: center;
                   font-family: var(--mono); font-size: 11px; color: var(--text-2);
                   white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chart-readout .hint { font-family: var(--body); color: var(--muted); }
  .chart-readout .is-up { color: var(--success); }
  .chart-readout .is-down { color: var(--danger); }

  /* stats filter sheet date inputs (mirrors the games sheet's inline pair) */
  .sheet-dates { display: flex; gap: 8px; padding: 4px 6px 8px; }
  .sheet-dates input { flex: 1 1 0; min-width: 0; min-height: 42px;
                       background: var(--bg-elevated); border: 1px solid var(--border-subtle);
                       border-radius: 10px; color: var(--text-1); padding: 6px 10px;
                       font-family: var(--mono); font-size: 13px; }

  /* ── tourney-mobile (agent F) ── */
  /* THE RUN: the latest event promoted to a hero card — big ordinal placement,
     seed→finish delta, then its sets as one-line rows */
  .tm-run { margin-top: 10px; border-color: var(--border); }
  .tm-run-title .t { display: block; font-weight: 700; font-size: 15px;
                     white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tm-run-title .s { display: block; font-size: 11px; color: var(--text-3); margin-top: 1px;
                     white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tm-run-hero { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  .tm-run-place { flex: none; font-family: var(--display); font-weight: 800;
                  font-size: 34px; line-height: 1; letter-spacing: -0.02em;
                  color: var(--purple); }
  .tm-place--gold   { color: #ffd35c; }
  .tm-place--silver { color: #cfd8dc; }
  .tm-place--bronze { color: #e8a06b; }
  .tm-run-sub { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column;
                gap: 2px; font-size: 11px; color: var(--text-3); }
  .tm-run-insight { font-size: 11px; color: var(--text-3); margin-top: 8px; line-height: 1.5; }

  /* upset badges: purple = you upset up (UF n), red = you got upset */
  .tm-badge { flex: none; font-size: 9px; font-weight: 800; color: #06150c;
              background: var(--purple); padding: 2px 6px; border-radius: 4px;
              font-family: var(--display); white-space: nowrap; }
  .tm-badge--down { background: var(--danger); color: #fff; }

  /* trajectory strip: diverging bars off a midline (your seed), tap for the
     event readout — same tap-readout pattern as the stats charts */
  .tm-traj { display: flex; gap: 3px; height: 64px; position: relative; margin-top: 6px; }
  .tm-traj::before { content: ''; position: absolute; left: 0; right: 0; top: 50%;
                     height: 1px; background: var(--border); }
  .tm-traj-col { flex: 1 1 0; min-width: 0; max-width: 26px; position: relative; }
  .tm-traj-bar { position: absolute; left: 18%; right: 18%; border-radius: 2px; }
  .tm-traj-bar.is-up   { bottom: 50%; background: var(--success); opacity: .85; }
  .tm-traj-bar.is-down { top: 50%; background: var(--danger); opacity: .85; }
  .tm-traj-bar.is-even { top: calc(50% - 1px); height: 2px; background: var(--text-3); opacity: .85; }
  .tm-traj-col.is-sel .tm-traj-bar { opacity: 1; box-shadow: 0 0 0 1px var(--text-1); }

  /* two-line list rows (best wins, demons): name over context, badge left */
  .tm-tworow { padding: 7px 0; gap: 10px; }
  .tm-rowmain { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .tm-rowmain .n { font-size: 13px; font-weight: 600;
                   white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tm-rowmain .n small { color: var(--muted); font-weight: 400; font-size: 10px; margin-left: 5px; }
  .tm-rowmain .e { font-size: 10.5px; color: var(--text-3);
                   white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tm-demon-rec { flex: none; min-width: 42px; text-align: center;
                  font-family: var(--mono); font-size: 12px; font-weight: 700;
                  color: var(--danger); background: var(--danger-muted);
                  border-radius: 6px; padding: 3px 7px; }

  /* head-to-head: name · sets · winbar · W–L */
  .tm-h2h-rec { flex: 0 0 46px; text-align: right; font-family: var(--mono); font-size: 11.5px; }
  .tm-h2h-rec .is-up { color: var(--success); }
  .tm-h2h-rec .is-down { color: var(--danger); }

  /* past-events divider + start.gg attribution */
  .tm-subhead { font-family: var(--display); font-size: 13px; font-weight: 700;
                color: var(--text-3); margin: 18px 4px 0; letter-spacing: .02em; }
  .tm-subhead span { font-family: var(--mono); font-size: 10.5px; font-weight: 500;
                     color: var(--muted); margin-left: 4px; }
  .tm-attrib { text-align: center; font-size: 10px; color: var(--muted); margin: 16px 0 4px; }
  .tm-attrib a { color: var(--muted); }

  /* ── randall (agent H) ── */
  /* chat thread: user bubbles right in accent-muted, Randall left elevated;
     bottom padding clears the pinned input bar + tab bar */
  .rd-thread { display: flex; flex-direction: column; gap: 10px;
               padding: 4px 0 calc(64px + 8px); }
  .rd-msg { max-width: 86%; padding: 10px 13px; border-radius: 18px;
            font-size: 14px; line-height: 1.55; overflow-wrap: break-word; }
  .rd-msg p { margin: 0; }
  .rd-msg p + p { margin-top: 8px; }
  .rd-msg code { font-family: var(--mono); font-size: 12.5px;
                 background: var(--bg-deep); border-radius: 5px; padding: 1px 5px; }
  .rd-msg .rd-li { display: block; padding-left: 14px; position: relative; }
  .rd-msg .rd-li::before { content: '·'; position: absolute; left: 3px;
                           color: var(--accent); font-weight: 800; }
  .rd-msg--user {
    align-self: flex-end; border-bottom-right-radius: 6px;
    background: var(--accent-muted);
    border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
  }
  .rd-msg--randall {
    align-self: flex-start; border-bottom-left-radius: 6px;
    background: var(--bg-elevated); border: 1px solid var(--border-subtle);
  }
  .rd-msg--error { border-color: color-mix(in srgb, var(--danger) 55%, transparent);
                   color: var(--danger); }
  .rd-turn { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }

  /* typing indicator: three breathing dots + what Randall is doing */
  .rd-typing { display: inline-flex; align-items: center; gap: 4px;
               color: var(--text-3); font-size: 12px; }
  .rd-typing span { margin-left: 5px; }
  .rd-typing i { width: 6px; height: 6px; border-radius: 99px;
                 background: var(--accent); opacity: .3;
                 animation: rdDot 1.1s ease-in-out infinite; }
  .rd-typing i:nth-child(2) { animation-delay: .18s; }
  .rd-typing i:nth-child(3) { animation-delay: .36s; }
  @keyframes rdDot { 0%, 100% { opacity: .25; transform: none; }
                     40% { opacity: 1; transform: translateY(-2px); } }

  /* tappable game/combo chips under a reply -> openDetail */
  .rd-chips { display: flex; flex-direction: column; gap: 6px; width: 86%; }
  .rd-chip { display: flex; align-items: center; gap: 8px; width: 100%;
             text-align: left; font-size: 12px; font-weight: 600;
             background: var(--bg-surface); border: 1px solid var(--border-subtle);
             border-radius: 12px; padding: 8px 10px; color: var(--text-2); }
  .rd-chip:active { background: var(--bg-hover); }
  .rd-chip img { width: 18px; height: 18px; flex: none; image-rendering: pixelated; }
  .rd-chip span { min-width: 0; white-space: nowrap; overflow: hidden;
                  text-overflow: ellipsis; }
  .rd-chip .rd-chip-go { margin-left: auto; color: var(--accent);
                         font-size: 15px; flex: none; }

  /* input bar pinned above the tab bar; 16px input stops iOS zoom-on-focus */
  .rd-inputbar { position: fixed; left: 0; right: 0;
                 bottom: calc(var(--tabbar) + var(--sab)); z-index: 15;
                 padding: 8px 12px; border-top: 1px solid var(--border-subtle); }
  .rd-inputbar-inner { display: flex; gap: 8px; max-width: 680px; margin: 0 auto; }
  .rd-input { flex: 1 1 auto; min-width: 0; min-height: 44px;
              -webkit-user-select: text; user-select: text;
              background: var(--bg-elevated); border: 1px solid var(--border-subtle);
              border-radius: 22px; color: var(--text-1); font-size: 16px;
              font-family: var(--body); padding: 10px 16px; }
  .rd-input:focus-visible { outline: none; border-color: var(--accent); }
  .rd-input:disabled { opacity: .55; }
  .rd-send { flex: none; width: 44px; height: 44px; border: none; border-radius: 99px;
             background: linear-gradient(135deg, #38e07c 0%, #21ba45 100%);
             color: #06150c; display: flex; align-items: center; justify-content: center; }
  .rd-send svg { width: 19px; height: 19px; }
  .rd-send:disabled { opacity: .35; }
  .rd-send:active { transform: scale(0.92); }

  /* empty state: Randall himself, a one-line pitch, tappable starters */
  /* weekly allowance meter: a fill bar and nothing else, deliberately — the
     desktop shows no dollar figures either, because "how much is left" is the
     only question and cents-per-turn is noise */
  .rd-usage { margin: 14px 6px 2px; }
  .rd-usage-top { display: flex; justify-content: space-between; align-items: baseline;
                  font-size: 12px; color: var(--text-2); margin-bottom: 6px; }
  .rd-usage-pct { font-family: var(--mono); font-size: 11px; color: var(--text-3); }
  .rd-usage-bar { height: 4px; border-radius: 999px; background: var(--bg-surface);
                  overflow: hidden; }
  .rd-usage-bar i { display: block; height: 100%; background: var(--accent);
                    border-radius: 999px; transition: width .3s var(--ease); }
  .rd-usage.is-full .rd-usage-bar i { background: var(--danger); }
  .rd-usage.is-full .rd-usage-pct { color: var(--danger); }

  /* "Report this chat" sheet: note + contact, a collapsible "What gets sent",
     one Send button (the sheet's own Cancel closes it) */
  .rd-report { display: flex; flex-direction: column; gap: 10px; padding: 2px 6px 4px; }
  .rd-report p { margin: 0; font-size: 13px; color: var(--text-2); line-height: 1.45; }
  .rd-report textarea, .rd-report input {
    width: 100%; box-sizing: border-box; font: inherit; font-size: 15px;
    background: var(--bg-elevated); color: var(--text-1);
    border: 1px solid var(--border-subtle); border-radius: 12px; padding: 10px 12px;
  }
  .rd-report textarea { min-height: 88px; resize: vertical; }
  .rd-report textarea:focus-visible, .rd-report input:focus-visible { outline: none; border-color: var(--accent); }
  .rd-report details { border: 1px solid var(--border-subtle); border-radius: 12px; padding: 8px 10px;
                       font-size: 12.5px; color: var(--text-2); }
  .rd-report summary { color: var(--text-1); font-weight: 600; }
  .rd-report ul { margin: 6px 0; padding-left: 18px; }
  .rd-report pre { max-height: 220px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere;
                   background: var(--bg-surface); border-radius: 10px; padding: 8px; font-size: 11px; }
  .rd-report-send { min-height: 48px; border: none; border-radius: 14px; font: inherit; font-weight: 700;
                    background: linear-gradient(135deg, #38e07c 0%, #21ba45 100%); color: #06150c; }
  .rd-report-send:disabled { opacity: .45; }
  .rd-report-error { color: var(--danger) !important; }

  .rd-empty { text-align: center; padding: 34px 12px 8px; }
  .rd-empty h2 { font-family: var(--display); font-size: 20px; margin-top: 12px; }
  .rd-empty p { font-size: 13px; color: var(--text-3); line-height: 1.6;
                margin: 6px auto 0; max-width: 300px; }
  .rd-face { display: inline-flex; align-items: center; justify-content: center;
             width: 52px; height: 52px; border-radius: 18px;
             background: var(--bg-elevated); border: 1px solid var(--border-subtle); }
  .rd-face svg { width: 40px; height: 40px; }
  .rd-msg .rd-face, .rd-upsell .rd-face { width: 40px; height: 40px; border-radius: 13px;
                                          margin-bottom: 8px; }
  .rd-msg .rd-face svg { width: 30px; height: 30px; }
  .rd-starters { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
  .rd-starter { width: 100%; min-height: 46px; text-align: left; font-size: 13.5px;
                font-weight: 600; color: var(--accent); padding: 10px 16px;
                background: var(--accent-muted); border-radius: 14px;
                border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); }
  .rd-starter:active { background: var(--bg-surface); }

  /* Patreon upsell (in-band no_ai) — friendly card, never an error toast */
  .rd-upsell { max-width: 92%; }
  .rd-upsell-cta { display: inline-flex; align-items: center; justify-content: center;
                   min-height: 40px; margin-top: 10px; padding: 8px 18px;
                   border-radius: 999px; text-decoration: none;
                   background: linear-gradient(135deg, #38e07c 0%, #21ba45 100%);
                   color: #06150c; font-family: var(--display); font-weight: 700;
                   font-size: 13px; }

  /* ── player-overlays (agent I) ── */
  /* overlays.js paints the input display + action readout straight onto the
     player canvas (burned into exports), and its settings sheet reuses the
     existing .sheet / .sheet-row styles — no additional rules needed. */

  /* ---- inline clip cards (Randall chat) ---- */
  /* clipcard.js — thumbnail players inside a chat bubble. The reel matches the
     bubble's 86% width so a clip lines up with the text above it. */
  .cc-reel { display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
             width: 86%; margin: 2px 0 2px; }
  .cc-reel.is-single { grid-template-columns: 1fr; }
  .cc { min-width: 0; }
  /* aspect-ratio, not a height: the canvas is sized in JS from clientWidth and
     a percentage height would collapse to 0 inside the flex-column thread */
  .cc-stage { position: relative; aspect-ratio: 16 / 9; overflow: hidden;
              border-radius: 12px; background: var(--bg-deep);
              border: 1px solid var(--border-subtle); }
  .cc-stage:active { border-color: var(--accent); }
  .cc-stage.is-dead:active { border-color: var(--border-subtle); }
  .cc-stage:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .cc-canvas { display: block; width: 100%; height: 100%; }
  .cc-note { position: absolute; inset: 0; display: grid; place-items: center;
             padding: 0 10px; text-align: center;
             font-size: 11px; color: var(--text-3); pointer-events: none; }
  .cc-note.is-err { color: var(--danger); }
  .cc-title { margin-top: 5px; font-size: 11.5px; line-height: 1.35;
              color: var(--text-2); overflow-wrap: break-word; }

  /* ---- conversion timeline ---- */
  /* detail.js convTimeline() paints two lanes into this strip. 26px is the
     smallest height a finger can hit reliably, and touch-action:none is
     load-bearing — without it dragging along the strip scrolls the page
     instead of seeking. It hides itself (v1 bundles, doubles, no conversions),
     so nothing else may depend on it occupying space. */
  /* flex:none — in the theater's flex column the stage canvas takes the slack,
     and a shrinkable 26px strip would lose its touch height on short screens */
  .convtl {
    display: block; flex: none; width: calc(100% - 28px); height: 26px;
    margin: 0 14px 6px; border-radius: 7px;
    background: var(--bg-elevated); border: 1px solid var(--border-subtle);
    box-sizing: border-box; touch-action: none;
  }
  .convtl[hidden] { display: none; }
  /* Fullscreen: the bottom safe-area inset moves onto the player itself, since
     the strip below the transport may not be there to carry it. */
  .dplayer.is-full { padding-bottom: var(--sab); }
  .dplayer.is-full .transport { padding-bottom: 6px; }

  /* ---- frame step ---- */
  /* The transport now carries up to six buttons plus the scrubber. Two rules
     buy back the width: the row's own gap drops to 8px, and .tgrp collapses
     the gaps INSIDE the play cluster to 4px so the steps read as attached to
     play/pause rather than as separate stops on the row. At 360px that leaves
     the scrubber ~120px in the game player and ~110px in the theater — measure
     before adding anything else to this row.
     touch-action:none is load-bearing on .stepbtn: without it a press-and-hold
     is treated as the start of a page pan, the browser fires pointercancel,
     and the repeat dies about a third of a second in. */
  .transport { gap: 8px; }
  .tgrp { display: flex; align-items: center; gap: 4px; flex: none; }
  .stepbtn {
    flex: none; min-width: 34px; min-height: 34px; padding: 4px;
    background: transparent; border-color: transparent;
    color: var(--text-2);
    touch-action: none; -webkit-user-select: none; user-select: none;
  }
  .stepbtn:active { color: var(--accent); background: var(--bg-surface); }
  .stepbtn svg { display: block; pointer-events: none; }

  /* ---- ±5s + speed (#93) ---- */
  /* Its own row under the transport: the row above has no width left (see
     the note on .transport). Skips on the left under play/pause; speed is a
     .chipsel so the native picker does the choosing, lit when not 1×. */
  .xport2 {
    display: flex; align-items: center; gap: 4px; flex: none;
    padding: 0 14px 6px;
  }
  .xport2 .stepbtn { min-width: 40px; min-height: 36px; }
  .speedsel { margin-left: auto; min-height: 34px; padding: 4px 12px;
              font-family: var(--mono); font-weight: 600; }
