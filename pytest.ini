[pytest]
# All tests live under tests/ (app/ holds only what ships). The documented command,
# run from the repo root, is:  pytest tests/backend
# tests/ is a package (tests/__init__.py), so pytest puts the repo root on sys.path and
# `from tests.paths import REPO, APP, BACKEND` works from every test.
testpaths = tests/backend
# The default run is the FAST set. Slow = real game files, subprocesses, the rig pipeline.
#   pytest tests/backend                          fast set (default)
#   pytest -m slow tests/backend                  only the slow set
#   pytest -m "slow or not slow" tests/backend    everything
addopts = -m "not slow" -n auto --dist loadfile
markers =
    slow: integration-grade test (real game files, subprocesses, rig pipeline); run with -m slow
# Keep temp dirs only for failed tests: the assistant/studio tests copy ~48 MB each and six
# parallel workers x three retained runs reached 1.4 GB under app/scratch.
tmp_path_retention_policy = failed
tmp_path_retention_count = 1
cache_dir = app/scratch/.pytest_cache
