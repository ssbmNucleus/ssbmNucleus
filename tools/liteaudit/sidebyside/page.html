<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:#000} canvas{display:block}
</style></head><body><div id="g"></div>
<script>
// Paint one replay frame several times, each with its own fixed camera, stacked with no gaps.
// ?lib=<paintlib.js URL>&job=<job script URL>, the job setting
// window.JOB = { bundle, packs, charmaps, data, idx, views: [{ cx, cy, S, w, h }], randall: data URL or null }
const q = new URLSearchParams(location.search)
function load(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s) }) }
(async () => {
  await load(q.get('lib')); await load(q.get('job'))
  const J = window.JOB, WL = window.WL, b = J.bundle
  if (WL.registerStageDataLoader) WL.registerStageDataLoader(id => J.data.stages[id] || null)
  if (WL.registerFighterDataLoader) WL.registerFighterDataLoader(id => J.data.fighters[id] || null)
  if (WL.registerItemDataLoader) WL.registerItemDataLoader(id => J.data.items[id] || null)
  // the hit sparks' and sword trails' per-fighter tables (data/hits) (paint never waits for them)
  if (WL.registerHitDataLoader) WL.registerHitDataLoader(id => J.data.hits?.[id] || null)
  await Promise.all([WL.ensureStageData?.(b.meta.stage), WL.ensureReplayFighterData?.(b), WL.ensureReplayItemData?.(b),
    WL.ensureReplayHitData?.(b)])
  const anim = WL.narrowAnimations ? WL.narrowAnimations(b, J.charmaps, J.packs) : J.packs
  const renderer = WL.createRenderer(J.charmaps)
  for (const v of J.views) {
    const cv = document.createElement('canvas'); cv.width = v.w; cv.height = v.h
    const ctx = cv.getContext('2d')
    const view = { S: v.S, ox: v.w / 2 - v.cx * v.S, oy: v.h / 2 + v.cy * v.S }
    WL.paintFrame(ctx, b, anim, renderer, J.idx, view, 1)
    if (b.meta.stage === 8) WL.drawRandall(ctx, b.meta.start_frame + J.idx, view, 1)
    document.getElementById('g').append(cv)
  }
  document.title = 'done'
})().catch(e => { document.body.style.background = '#fff'; document.body.append('ERROR ' + e.stack) })
</script></body></html>
